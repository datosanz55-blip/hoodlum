[project]
name = "yandex-leads"
version = "1.0.0"
description = "Парсер Яндекс Карт для поиска клиентов на digital-услуги"
requires-python = ">=3.10"
dependencies = ["playwright>=1.45", "httpx>=0.27", "openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
yandex-leads = "yandex_leads.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["yandex_leads*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
